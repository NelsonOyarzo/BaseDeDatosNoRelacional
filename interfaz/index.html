<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QuickTrack</title>
  <meta name="description" content="Panel de QuickTrack: órdenes de entrega, clientes, rutas y consultas sobre MongoDB Atlas">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232a78d6'/%3E%3Cpath d='M9 17h9l-3 4m3-4-3-4M18 11h5v10h-5' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/interfaz/estilos.css">
  <script>
    // Aplica el tema guardado antes de pintar, para que no parpadee
    try { const t = localStorage.getItem("qt-tema"); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
  <script type="module" src="/interfaz/js/app.js"></script>
</head>
<body>
  <header class="barra-superior">
    <a class="marca" href="#/resumen">
      <span class="logo" aria-hidden="true"></span>
      <span class="marca-texto"><strong>QuickTrack</strong><span>Logística de entregas express</span></span>
    </a>
    <div class="barra-acciones">
      <span id="estado-conexion" class="conexion" role="status"><span class="punto"></span><span class="texto">Conectando…</span></span>
      <button id="cambiar-tema" class="boton boton-icono" type="button" aria-label="Cambiar entre tema claro y oscuro" title="Cambiar tema">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>

  <div class="marco">
    <aside class="lateral-nav">
    <nav class="navegacion" aria-label="Secciones">
      <a href="#/resumen" data-vista="resumen">Resumen</a>
      <a href="#/ordenes" data-vista="ordenes">Órdenes</a>
      <a href="#/clientes" data-vista="clientes">Clientes</a>
      <a href="#/rutas" data-vista="rutas">Rutas</a>
      <a href="#/consultas" data-vista="consultas">Consultas</a>
      <a href="#/integridad" data-vista="integridad">Integridad</a>
      <div class="nav-pie">
        <a href="/docs" target="_blank" rel="noopener">Documentación de la API ↗</a>
      </div>
    </nav>
    </aside>
    <main id="contenido" tabindex="-1"></main>
  </div>

  <div id="avisos" class="avisos" aria-live="polite"></div>
  <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
  <noscript><p class="noscript">La interfaz necesita JavaScript habilitado.</p></noscript>
</body>
</html>
